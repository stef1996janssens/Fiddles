name: Build and Deploy Blazor WASM to GitHub Pages

permissions:
  contents: write      # allows pushing commits
  pages: write         # allows GitHub Pages deployment
  id-token: write

on:
  push:
    branches:
      - main  # Trigger when pushing to main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'  # Change to your target .NET version

      - name: Setup NuGet for GitHub Packages
        run: |
            dotnet nuget add source "https://nuget.pkg.github.com/stef1996janssens/index.json" \
              --name github \
              --username stef1996janssens \
              --password ${{ secrets.TOKEN_NUGET }} \
              --store-password-in-clear-text

      - name: Restore dependencies
        run: dotnet restore

      - name: Build and publish
        run: dotnet publish -c Release -o publish

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./publish/wwwroot
          publish_branch: gh-pages
          user_name: github-actions
          user_email: github-actions@github.com
